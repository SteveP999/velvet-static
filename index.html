<script id="artist-data" type="application/json">{"artist": {"id": "velvet-static", "name": "Velvet Static", "genre": "Synth-pop / Cold-wave / Dream Pop", "tagline": "The internet made her famous.   But it never made her happy.", "bio": "The internet made her famous.   But it never made her happy.", "theme": "warm_country", "logo": "images/logos/velvet-static-logo.png", "hero": "images/artist/velvet-static-hero-photo.png", "discographyBg": "images/artist/velvet-static-discography-bg.png", "videoBg": "images/artist/velvet-static-video-bg.png", "photos": ["images/artist/velvet-static-photo-1.png", "images/artist/velvet-static-photo-2.png", "images/artist/velvet-static-photo-3.png"]}, "latest": {"title": "Hit The Peak", "artist": "Velvet Static", "album": "Velvet Static", "type": "Latest Single", "cover": "images/covers/velvet-static-hit-the-peak-cover.png", "image": "images/covers/velvet-static-hit-the-peak-cover.png", "audio": "https://www.dropbox.com/scl/fi/z2j290ir55hetk54q8x8u/hit-the-peak-by-velvet-static.mp3?rlkey=6dshx8xxdezk4i2h8ymwcvqbk&raw=1", "audioSrc": "https://www.dropbox.com/scl/fi/z2j290ir55hetk54q8x8u/hit-the-peak-by-velvet-static.mp3?rlkey=6dshx8xxdezk4i2h8ymwcvqbk&raw=1", "videos": []}, "songs": [{"id": "velvet-static-hit-the-peak", "num": "01", "title": "Hit The Peak", "artist": "Velvet Static", "album": "Velvet Static", "trackNumber": 1, "albumOrder": 1, "albumCover": "images/covers/velvet-static-velvet-static-ALBUM-cover.png", "type": "single", "isLatest": true, "cover": "images/covers/velvet-static-hit-the-peak-cover.png", "audio": "https://www.dropbox.com/scl/fi/z2j290ir55hetk54q8x8u/hit-the-peak-by-velvet-static.mp3?rlkey=6dshx8xxdezk4i2h8ymwcvqbk&raw=1", "audioSrc": "https://www.dropbox.com/scl/fi/z2j290ir55hetk54q8x8u/hit-the-peak-by-velvet-static.mp3?rlkey=6dshx8xxdezk4i2h8ymwcvqbk&raw=1", "videos": [], "includeOnRadio": true, "includeOnHomepage": true, "explicit": false, "tags": [], "streaming": {}}], "hasVideoSection": true}</script>
<script>
const DATA = JSON.parse(document.getElementById('artist-data').textContent);
const SONGS = DATA.songs || [];
let currentIndex = -1;
const audio = document.getElementById('audio');

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
}
function songCover(song) { return song.cover || song.albumCover || ''; }
function streamingRow(song) {
  const s = song.streaming || {};
  const items = [];
  if (s.spotify) items.push(`<a class="stream-link spotify" href="${esc(s.spotify)}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">Spotify</a>`);
  if (s.apple) items.push(`<a class="stream-link apple" href="${esc(s.apple)}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">Apple Music</a>`);
  if (s.youtubeMusic) items.push(`<a class="stream-link ytm" href="${esc(s.youtubeMusic)}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">YouTube Music</a>`);
  if (!items.length) return '';
  return `<div class="track-streams">${items.join('')}</div>`;
}

function updateNowPlayingArt(song) {
  // Find which album this song belongs to and show its art
  const cover = song.cover || '';
  const albumSlug = (song.album || '').replace(/[^a-z0-9]/gi,'_').toLowerCase();

  // Hide all now-playing blocks first
  document.querySelectorAll('.now-playing-art').forEach(el => el.style.display = 'none');

  if (!cover) return;

  // Show block for this album
  const block = document.getElementById('now-playing-art-' + albumSlug);
  const img   = document.getElementById('now-playing-img-' + albumSlug);
  const title = document.getElementById('now-playing-title-' + albumSlug);

  if (block && img) {
    img.src = cover;
    if (title) title.textContent = song.title || '';
    block.style.display = 'block';

    // Expand album if collapsed, then scroll to it
    const body = document.getElementById('album-body-' + albumSlug);
    if (body && body.style.display === 'none') {
      const chevron = document.getElementById('chevron-' + albumSlug);
      body.style.display = '';
      if (chevron) chevron.style.transform = 'rotate(0deg)';
    }
    // Scroll Now Playing art into view
    setTimeout(() => {
      block.scrollIntoView({behavior:'smooth', block:'center'});
    }, 120);
  }
}
function videoUrl(song) {
  const videos = Array.isArray(song.videos) ? song.videos : [];
  if (!videos.length) return '';
  return videos[0].youtube || videos[0].url || videos[0].href || '';
}
function youtubeEmbedUrl(url) {
  const value = String(url || '').trim();
  if (!value) return '';
  try {
    const u = new URL(value);
    let id = '';
    if (u.hostname.includes('youtu.be')) {
      id = u.pathname.replace('/', '');
    } else if (u.searchParams.get('v')) {
      id = u.searchParams.get('v');
    } else if (u.pathname.includes('/embed/')) {
      id = u.pathname.split('/embed/')[1].split('/')[0];
    } else if (u.pathname.includes('/shorts/')) {
      id = u.pathname.split('/shorts/')[1].split('/')[0];
    }
    return id ? `https://www.youtube.com/embed/${id}` : value;
  } catch (e) {
    return value;
  }
}
function videoMarkup(song) {
  const url = videoUrl(song);
  if (!url) return '<span class="track-badge">Video Coming Soon</span>';
  return `<a class="track-badge" target="_blank" rel="noreferrer" href="${esc(url)}">Watch Video</a>`;
}
function renderLatest() {
  const latest = SONGS.find(s => s.isLatest) || SONGS[0];
  const el = document.getElementById('latest-render');
  if (!latest) {
    el.innerHTML = '<div><div class="latest-badge">Latest Release</div><h2 class="latest-title">New Music Coming Soon</h2></div>';
    return;
  }
  el.innerHTML = `
    <img class="latest-cover" src="${esc(songCover(latest))}" alt="${esc(latest.title)}">
    <div>
      <div class="latest-badge">${esc(latest.type || 'Latest Release')}</div>
      <h2 class="latest-title">${esc(latest.title)}</h2>
      <div class="latest-sub">${esc(latest.album || '')}</div>
      <button class="latest-play-btn" onclick="playSongById('${esc(latest.id)}')">&#9654; Play</button>
      ${videoMarkup(latest)}
    </div>`;
}
function renderVideo() {
  const container = document.getElementById('video-render');
  if (!container) return;

  const videoSongs = SONGS
    .filter(s => videoUrl(s))
    .sort((a, b) => {
      const av = Array.isArray(a.videos) && a.videos.length ? (a.videos[0].order ?? a.videos[0].videoOrder ?? 9999) : 9999;
      const bv = Array.isArray(b.videos) && b.videos.length ? (b.videos[0].order ?? b.videos[0].videoOrder ?? 9999) : 9999;
      return parseInt(av, 10) - parseInt(bv, 10) || String(a.title || '').localeCompare(String(b.title || ''));
    });

  if (!videoSongs.length) {
    container.innerHTML = '<div class="video-coming-soon visible"><div class="play-triangle"></div><strong>Video Coming Soon</strong><span>' + esc(DATA.artist.name) + ' does not have a video assigned yet. The video system is installed and ready.</span></div>';
    return;
  }

  container.innerHTML = `
    <div class="video-grid">
      ${videoSongs.map(song => `
        <div class="video-card video-card-embed">
          <div class="video-embed-wrap">
            <iframe
              src="${esc(youtubeEmbedUrl(videoUrl(song)))}"
              title="${esc(song.title)} video"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen></iframe>
          </div>
          <div class="video-card-title">${esc(song.title)}</div>
          <div class="video-card-actions">
            <a class="track-badge" href="${esc(videoUrl(song))}" target="_blank" rel="noreferrer">Watch on YouTube</a>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
function trackOrder(song) {
  const raw = song.trackNumber ?? song.albumOrder ?? song.num ?? 9999;
  const n = parseInt(raw, 10);
  return Number.isFinite(n) ? n : 9999;
}
function renderAlbums() {
  const root = document.getElementById('albums');

  if (!SONGS.length) {
    root.innerHTML = '<section class="album-detail-section"><div class="discography-header"><div class="section-eyebrow">Music</div><h2 class="section-title">Music Coming Soon</h2><div class="rule"></div></div></section>';
    return;
  }

  const albums = new Map();

  SONGS.forEach(song => {
    const album = song.album || 'Singles';
    if (!albums.has(album)) albums.set(album, []);
    albums.get(album).push(song);
  });

  let html = '<div class="discography-header"><div class="section-eyebrow">Latest Releases</div><h2 class="section-title">Discography</h2><div class="rule"></div></div>';

  Array.from(albums.entries()).forEach(([album, songs], idx) => {
    const orderedSongs = [...songs].sort((a, b) => trackOrder(a) - trackOrder(b) || String(a.title || '').localeCompare(String(b.title || '')));
    const cover = orderedSongs.find(s => s.albumCover)?.albumCover || songCover(orderedSongs[0]) || '';
    const sideClass = idx % 2 ? 'cover-right' : 'cover-left';

    const trackRows = orderedSongs.map((song, i) => {
      const latestBadge = (song.isLatest ? '<span class="track-badge">Latest</span>' : '') + (videoUrl(song) ? ' <a class="track-badge" target="_blank" rel="noreferrer" href="' + esc(videoUrl(song)) + '">Watch Video</a>' : '');
      return `
        <div class="track-row">
          <div class="track-num">${String(i + 1).padStart(2, '0')}</div>
          <div class="track-title" title="${esc(song.title)}">${esc(song.title)}</div>
          <div class="track-badge-cell">${latestBadge}</div>
          <button class="track-play-btn" onclick="playSongById('${esc(song.id)}')" aria-label="Play ${esc(song.title)}">&#9654;</button>
        </div>
        ${streamingRow(song)}
      `;
    }).join('');

    const songCards = orderedSongs.map(song => `
      <div class="release-card" onclick="playSongById('${esc(song.id)}')">
        <div class="release-art">
          <img src="${esc(songCover(song))}" alt="${esc(song.title)}">
          <div class="release-overlay"><div class="release-play">&#9654;</div></div>
        </div>
        <div class="release-title">${esc(song.title)}</div>
        <div class="release-album">${esc(song.album || '')}</div>
        ${videoUrl(song) ? `<a class="track-badge" target="_blank" rel="noreferrer" href="${esc(videoUrl(song))}" onclick="event.stopPropagation()">Watch Video</a>` : ''}
      </div>
    `).join('');

    const albumSlug = album.replace(/[^a-z0-9]/gi,'_').toLowerCase();
    html += `
      <section class="album-detail-section">
        <div class="album-collapse-header" onclick="toggleAlbum('${albumSlug}')" style="cursor:pointer;display:flex;align-items:center;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--line);margin-bottom:1.25rem">
          <img src="${esc(cover)}" alt="${esc(album)}" style="width:52px;height:52px;object-fit:cover;border-radius:4px;flex-shrink:0">
          <div style="flex:1;min-width:0">
            <div style="font-family:var(--font-head);font-size:1.1rem;color:var(--cream)">${esc(album)}</div>
            <div style="font-size:.7rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase">${orderedSongs.length} tracks</div>
          </div>
          <div id="chevron-${albumSlug}" style="color:var(--accent);font-size:1.2rem;flex-shrink:0;transition:transform .2s">&#9660;</div>
        </div>
        <div id="album-body-${albumSlug}" class="album-collapse-body">
        <div class="album-layout ${sideClass}">
          <div class="album-cover-wrap">
            <img class="album-cover" id="album-cover-${albumSlug}" src="${esc(cover)}" alt="${esc(album)}">
            <div class="now-playing-art" id="now-playing-art-${albumSlug}" style="display:none">
              <div class="now-playing-label">&#9654; Now Playing</div>
              <img class="now-playing-img" id="now-playing-img-${albumSlug}" src="" alt="">
              <div class="now-playing-title" id="now-playing-title-${albumSlug}"></div>
              <div class="now-playing-controls">
                <button class="np-ctrl-btn" onclick="prevTrack()" title="Previous">&#9664;&#9664;</button>
                <button class="np-ctrl-btn np-play-pause" id="np-playpause-${albumSlug}" onclick="togglePlay()" title="Play/Pause">&#10074;&#10074;</button>
                <button class="np-ctrl-btn" onclick="nextTrack()" title="Next">&#9654;&#9654;</button>
              </div>
            </div>
          </div>

          <div class="album-info">
            <div class="album-header-row">
              <span class="album-badge">Album</span>
              <h2 class="album-title">${esc(album)}</h2>
              <span class="album-artist-inline">${esc(DATA.artist.name)}</span>
            </div>
            <div class="tracklist">${trackRows}</div>
          </div>

          <div class="album-track-art-block">
            <div class="album-track-art-heading">Album Tracks</div>
            <div class="release-wall">${songCards}</div>
          </div>
        </div>
      </div></section>
    `;
  });

  root.innerHTML = html;
}

window.toggleAlbum = function(slug) {
  const body = document.getElementById('album-body-' + slug);
  const chevron = document.getElementById('chevron-' + slug);
  if (!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : '';
  if (chevron) chevron.style.transform = isOpen ? 'rotate(-90deg)' : 'rotate(0deg)';
};

function playLatest() {
  const latest = SONGS.find(s => s.isLatest) || SONGS[0];
  if (latest) playSongById(latest.id);
}
function playSongById(id) {
  const idx = SONGS.findIndex(s => s.id === id);
  if (idx >= 0) playIndex(idx);
}
function playIndex(idx) {
  const song = SONGS[idx];
  if (!song || !(song.audio || song.audioSrc)) return;
  currentIndex = idx;
  audio.src = song.audio || song.audioSrc;
  document.getElementById('p-thumb').src = songCover(song);
  document.getElementById('p-title').textContent = song.title;
  document.getElementById('p-sub').textContent = `${song.artist || DATA.artist.name} • ${song.album || ''}`;
  document.getElementById('player').classList.add('visible');
  audio.play();
  try { if (typeof gtag === 'function') gtag('event', 'play_song', { song_id: song.id, song_title: song.title, artist: song.artist || DATA.artist.name, album: song.album || '' }); } catch(e) {}
  document.getElementById('p-playbtn').innerHTML = '&#10074;&#10074;';
  // Show song art in the album section
  updateNowPlayingArt(song);
  // Sync Now Playing play/pause button
  document.querySelectorAll('.np-play-pause').forEach(btn => btn.innerHTML = '&#10074;&#10074;');
  // Tell HTR Radio to pause when artist site plays
  try { new BroadcastChannel('htr-audio').postMessage({type:'artist-play'}); } catch(e) {}
}
function togglePlay() {
  if (!audio.src) return playLatest();
  const playing = !audio.paused;
  if (!playing) {
    audio.play();
    document.getElementById('p-playbtn').innerHTML='&#10074;&#10074;';
    document.querySelectorAll('.np-play-pause').forEach(b=>b.innerHTML='&#10074;&#10074;');
  } else {
    audio.pause();
    document.getElementById('p-playbtn').innerHTML='&#9654;';
    document.querySelectorAll('.np-play-pause').forEach(b=>b.innerHTML='&#9654;');
  }
}
function nextTrack() { if (SONGS.length) playIndex((currentIndex + 1) % SONGS.length); }
function prevTrack() { if (SONGS.length) playIndex((currentIndex - 1 + SONGS.length) % SONGS.length); }
function seek(e) {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}
audio.addEventListener('timeupdate', () => {
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  const fmt = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  const cur = document.getElementById('p-current');
  const dur = document.getElementById('p-duration');
  if (cur) cur.textContent = fmt(audio.currentTime);
  if (dur && audio.duration) dur.textContent = fmt(audio.duration);
});
audio.addEventListener('ended', () => { document.querySelectorAll('.np-play-pause').forEach(b=>b.innerHTML='&#9654;'); nextTrack(); });
document.getElementById('volume').addEventListener('input', e => audio.volume = e.target.value);
function checkPhotoStrip() {
  const strip = document.getElementById('photo-strip');
  if ([...strip.querySelectorAll('img')].every(img => img.classList.contains('missing'))) strip.classList.add('empty');
}
renderLatest();
renderVideo();
renderAlbums();
</script>
</body>
</html>
